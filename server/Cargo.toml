[package]
name = "pulse-server"
description = "Pulse server: accounts, profiles, projects and the real-time dashboard"
version.workspace = true
edition.workspace = true
# sqlx 0.9 needs 1.94
rust-version = "1.94"
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.4"
pulse-core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
time = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
hmac = "0.12"
sha2.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
