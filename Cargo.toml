[workspace]
resolver = "3"
members = ["crates/pulse-core", "crates/pulse"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/hackclub/pulse"

[workspace.dependencies]
pulse-core = { path = "crates/pulse-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
