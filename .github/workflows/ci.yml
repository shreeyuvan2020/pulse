name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Recording smoke test
        if: matrix.os == 'windows-latest'
        # hosted runners may have no screen to record, so this only reports
        continue-on-error: true
        shell: bash
        run: |
          cargo run --release -- record --seconds 8 --out smoke 2>&1 | tee smoke.log
          grep -q "Frames: [1-9]" smoke.log
          cargo run --release -- verify smoke
