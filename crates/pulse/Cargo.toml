[package]
name = "pulse"
description = "Passive time tracking for building with AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pulse-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
webbrowser = "1"
winit = "0.30"
fs4 = "1"
mp4 = "0.14"
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
bzip2 = "0.6"
ureq = "3"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "pulse"
maintainer = "Hack Club <hi@hackclub.com>"
copyright = "2026, Hack Club"
license-file = "../../LICENSE"
extended-description = "Passive time tracking for building with AI coding agents. Records the screen at one frame per second while a coding agent session is open, tracks credited time locally, and can send it to a Pulse server. Recordings never leave the computer unless submitted."
section = "utils"
priority = "optional"
depends = "libx11-6, libxkbcommon0"
assets = [
    ["assets/tray.png", "usr/share/icons/hicolor/64x64/apps/pulse.png", "644"],
    # cargo-deb adjusts this path for --target builds itself
    ["target/release/pulse", "usr/bin/pulse", "755"],
]
