[package]
name = "pulse"
description = "Passive time tracking for building with AI coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pulse-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
webbrowser = "1"
winit = "0.30"
fs4 = "1"
mp4 = "0.14"
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
bzip2 = "0.6"
ureq = "3"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "pulse"
maintainer = "Hack Club <hi@hackclub.com>"
copyright = "2026, Hack Club"
license-file = "../../LICENSE"
extended-description = "Passive time tracking for building with AI coding agents. Records the screen at one frame per second while a coding agent session is open, tracks credited time locally, and can send it to a Pulse server. Recordings never leave the computer unless submitted. Wayland sessions use the pulse-wayland helper, which asks the desktop's screen sharing portal."
section = "utils"
priority = "optional"
# pulse itself runs on glibc 2.35 and newer; only the Wayland helper needs a newer
# system (PipeWire), so those are recommended, not required
depends = "libc6 (>= 2.35), libx11-6, libxkbcommon0"
recommends = "xdg-desktop-portal, libpipewire-0.3-0t64 | libpipewire-0.3-0"
assets = [
    ["assets/tray.png", "usr/share/icons/hicolor/64x64/apps/pulse.png", "644"],
    ["target/release/pulse", "usr/bin/pulse", "755"],
    ["target/release/pulse-wayland", "usr/bin/pulse-wayland", "755"],
]
